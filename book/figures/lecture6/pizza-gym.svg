<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="425" viewBox="0 0 1080 425" role="img" aria-labelledby="title desc">
<title id="title">Center → use long and short axes → retain one coordinate</title><desc id="desc">Toy pizza/gym counts (1,5),(2,4),(3,3),(4,2),(5,1) form a line. Centering at (3,3) gives scores along (1,-1)/sqrt2 with zero perpendicular scores; the retained one-dimensional scores are minus 2sqrt2, minus sqrt2, zero, sqrt2, 2sqrt2.</desc>
<rect width="1080" height="425" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<text x="25" y="40" class="title" >Center → use long and short axes → retain one coordinate</text>
<defs><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#C91E70"/></marker></defs>
<defs><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#357D22"/></marker></defs>
<text x="25" y="93" class="small" >1. Raw paired counts</text>
<text x="395" y="93" class="small" >2. Centered directions</text>
<text x="770" y="93" class="small" >3. Retained score</text>

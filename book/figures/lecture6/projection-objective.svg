<path d="M812 238 L800 250" fill="none" stroke="#357D22" stroke-width="1.5" />
<circle cx="796" cy="294" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<path d="M796 294 L820 270" fill="none" stroke="#357D22" stroke-width="1.5" />
<circle cx="873" cy="297" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<path d="M873 297 L860 310" fill="none" stroke="#357D22" stroke-width="1.5" />

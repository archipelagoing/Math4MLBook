<path d="M746 154 L725 175" fill="none" stroke="#357D22" stroke-width="1.5" />
<circle cx="751" cy="219" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<path d="M751 219 L760 210" fill="none" stroke="#357D22" stroke-width="1.5" />

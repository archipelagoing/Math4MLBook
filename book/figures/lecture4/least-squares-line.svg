<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">Fit vertical errors; check orthogonality in response space</title><desc id="desc">Data points (1,1),(2,2),(3,2), fitted line y=2/3+t/2, and vertical residuals observed minus fitted: minus one sixth, plus one third, minus one sixth.</desc>
<rect width="1000" height="460" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<defs><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#C91E70"/></marker></defs>
<defs><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#357D22"/></marker></defs>
<text x="25" y="40" class="title" >Fit vertical errors; check orthogonality in response space</text>
<path d="M80 80 V350" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="80" y="373" class="small" text-anchor="middle">0</text>
<path d="M180 80 V350" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="180" y="373" class="small" text-anchor="middle">1</text>
<path d="M280 80 V350" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="280" y="373" class="small" text-anchor="middle">2</text>
<path d="M380 80 V350" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="380" y="373" class="small" text-anchor="middle">3</text>
<path d="M480 80 V350" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="480" y="373" class="small" text-anchor="middle">4</text>
<path d="M80 260 H480" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="68" y="265" class="small" text-anchor="end">1</text>
<path d="M80 170 H480" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="68" y="175" class="small" text-anchor="end">2</text>
<path d="M80 80 H480" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="68" y="85" class="small" text-anchor="end">3</text>
<path d="M80 350 H495" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M80 350 V66" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="502" y="355" class="small" >t</text>
<text x="75" y="57" class="small" >y</text>
<path d="M80 290.0 L480 110.0" fill="none" stroke="#3975DB" stroke-width="3" />
<path d="M180 245.0 L180 260" fill="none" stroke="#C91E70" stroke-width="4" />
<circle cx="180" cy="245.0" r="4" fill="white" stroke="#3975DB" stroke-width="2"/>
<circle cx="180" cy="260" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<path d="M280 200.0 L280 170" fill="none" stroke="#C91E70" stroke-width="4" />
<circle cx="280" cy="200.0" r="4" fill="white" stroke="#3975DB" stroke-width="2"/>
<circle cx="280" cy="170" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<path d="M380 155.0 L380 170" fill="none" stroke="#C91E70" stroke-width="4" />
<circle cx="380" cy="155.0" r="4" fill="white" stroke="#3975DB" stroke-width="2"/>
<circle cx="380" cy="170" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<text x="120" y="290" class="small" >−1/6</text>
<text x="235" y="150" class="small" >+1/3</text>
<text x="390" y="213" class="small" >−1/6</text>
<text x="555" y="123" class="label" >Best line: y = 2/3 + t/2</text>
<text x="555" y="183" class="small" >e = (−1/6, 1/3, −1/6)</text>
<text x="555" y="230" class="small" >Squared error: 1/6</text>
<text x="555" y="291" class="small" >Column checks: Σeᵢ = 0, Σtᵢeᵢ = 0</text>
<text x="25" y="416" class="small" >Plot: vertical response gaps. Response space: e is perpendicular to both model columns.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
<title id="title">Subtract the old component before normalizing</title><desc id="desc">In equally scaled x,y axes, a1=(1,0), a2=(1,2). Subtracting projection (1,0) from a2 leaves u2=(0,2). The orthonormal directions are (1,0),(0,1).</desc>
<rect width="1000" height="430" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<defs><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#C91E70"/></marker></defs>
<defs><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#357D22"/></marker></defs>
<text x="25" y="40" class="title" >Subtract the old component before normalizing</text>
<path d="M75 140 V320" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="75" y="343" class="small" text-anchor="middle">0</text>
<path d="M165 140 V320" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="165" y="343" class="small" text-anchor="middle">1</text>
<path d="M255 140 V320" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="255" y="343" class="small" text-anchor="middle">2</text>
<path d="M345 140 V320" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="345" y="343" class="small" text-anchor="middle">3</text>
<path d="M75 230 H345" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="63" y="235" class="small" text-anchor="end">1</text>
<path d="M75 140 H345" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="63" y="145" class="small" text-anchor="end">2</text>
<path d="M75 320 H360" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M75 320 V126" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="367" y="325" class="small" >x</text>
<text x="70" y="117" class="small" >y</text>
<path d="M75 320 L165 140" fill="none" stroke="#C91E70" stroke-width="3" marker-end="url(#pink)"/>
<path d="M75 320 L165 320" fill="none" stroke="#357D22" stroke-width="3" marker-end="url(#green)"/>
<path d="M165 320 L165 140" fill="none" stroke="#357D22" stroke-width="3" marker-end="url(#green)"/>
<path d="M75 320 V140" fill="none" stroke="#357D22" stroke-width="2" stroke-dasharray="6 4"/>
<text x="175" y="120" class="small" >a₂ = (1, 2)</text>
<text x="177" y="242" class="small" >remainder (0, 2)</text>
<text x="460" y="120" class="label" >1. First direction: a₁ = (1, 0)</text>
<text x="460" y="177" class="small" >2. Remove projection: (1, 2) − (1, 0)</text>
<text x="460" y="228" class="label" >3. Remainder: u₂ = (0, 2)</text>
<text x="460" y="285" class="label" >4. Normalize: q₂ = (0, 1)</text>
<text x="25" y="389" class="small" >The translated vertical arrow and the dashed arrow represent the same remainder vector.</text>
</svg>

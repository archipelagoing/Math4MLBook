<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="440" viewBox="0 0 1080 440" role="img" aria-labelledby="title desc">
<title id="title">A feature score needs one user row and one movie row</title><desc id="desc">A user feature row passes through diagonal weights and pairs with a movie feature row, yielding a scalar score. The row lengths are both k. Missing ratings are not zero targets; fitting and calibration are separate steps.</desc>
<rect width="1080" height="440" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<text x="25" y="40" class="title" >A feature score needs one user row and one movie row</text>
<defs><marker id="pink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#C91E70"/></marker></defs>
<defs><marker id="green" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#357D22"/></marker></defs>
<rect x="25" y="145" width="225" height="115" rx="12" fill="#FFF0F6" stroke="#3975DB"/>
<text x="39" y="185" class="label" >User row Lᵢ</text>
<text x="39" y="228" class="small" >1 × k</text>
<text x="260" y="209" class="label" >×</text>
<rect x="290" y="145" width="225" height="115" rx="12" fill="#EFF9E7" stroke="#3975DB"/>
<text x="304" y="185" class="label" >Weights W</text>
<text x="304" y="228" class="small" >k × k diagonal</text>
<text x="525" y="209" class="label" >×</text>
<rect x="555" y="145" width="225" height="115" rx="12" fill="#FFF0F6" stroke="#3975DB"/>
<text x="569" y="185" class="label" >Movie row Mⱼᵀ</text>
<text x="569" y="228" class="small" >k × 1</text>
<text x="790" y="209" class="label" >=</text>
<rect x="820" y="145" width="225" height="115" rx="12" fill="#EFF9E7" stroke="#3975DB"/>
<text x="834" y="185" class="label" >One score</text>
<text x="834" y="228" class="small" >scalar</text>
<text x="25" y="102" class="small" >Feature order must match in all three factors.</text>
<text x="25" y="324" class="small" >Source example: User 1 × weights × Captain America → 0.0249</text>
<text x="25" y="381" class="small" >That is a raw feature score. The source supplies no fitted conversion to a 1–5 rating.</text>
</svg>

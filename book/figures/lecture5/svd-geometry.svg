<title id="title">SVD pairs input directions with output stretch directions</title><desc id="desc">A unit circle with right unit axes v1 at 45 degrees and v2 at 135 degrees maps to an ellipse with semiaxes 3u1 and u2, with u1 at 30 degrees and u2 at 120 degrees. Right and left axes are each orthonormal.</desc>

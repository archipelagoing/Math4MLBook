<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="505" viewBox="0 0 1080 505" role="img" aria-labelledby="title desc">
<title id="title">Changing a direction versus preserving its line</title><desc id="desc">Left: matrix [2,-1;1,2] maps (2,3) to (1,8). Right: [2,1;2,3] maps (1,2) to (4,8), on the same line. Both panels use equal coordinate scales.</desc>

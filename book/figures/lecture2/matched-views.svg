<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="title desc">
<title id="title">Two views constrain one matched point</title><desc id="desc">Front readings (2,3) and side readings (3,4) stack into (2,3,3,4). The repeated Y is an agreement check. Front alone leaves Z free.</desc>
<rect width="1000" height="340" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<text x="25" y="42" class="title" >Two views constrain one matched point</text>
<rect x="25" y="76" width="240" height="165" rx="12" fill="#FFF0F6" stroke="#C91E70" stroke-width="2"/>
<text x="41" y="109" class="label" >World point</text>
<text x="41" y="146" class="small" >X = 2</text>
<text x="41" y="180" class="small" >Y = 3</text>
<text x="41" y="214" class="small" >Z = 4</text>
<rect x="350" y="76" width="300" height="165" rx="12" fill="#FFF0F6" stroke="#C91E70" stroke-width="2"/>
<text x="366" y="109" class="label" >Matched views</text>
<text x="366" y="146" class="small" >Front: (X, Y) = (2, 3)</text>
<text x="366" y="180" class="small" >Side: (Y, Z) = (3, 4)</text>
<rect x="735" y="76" width="240" height="165" rx="12" fill="#FFF0F6" stroke="#C91E70" stroke-width="2"/>
<text x="751" y="109" class="label" >Stacked record</text>
<text x="751" y="146" class="small" >(2, 3, 3, 4)</text>
<text x="751" y="180" class="small" >Y appears twice</text>
<path d="M275 158 H335" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M665 158 H720" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="284" class="label" >Front only: (2, 3, t), any real t. Both views: (2, 3, 4).</text>
<text x="25" y="319" class="small" >Calibrated parallel-ray views, fixed origin, and matched labeled points.</text>
</svg>

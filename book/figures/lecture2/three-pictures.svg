<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc">
<title id="title">One system: intersection and column weights</title><desc id="desc">Lines y=(x-1)/2 and y=(11-3x)/2 intersect at (3,1). The same numbers weight columns (1,3) and (-2,2) to produce (1,11).</desc>
<rect width="1000" height="455" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<text x="25" y="39" class="title" >One system: intersection and column weights</text>
<path d="M80 90 V398" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="80" y="379" class="small" text-anchor="middle">0</text>
<path d="M124 90 V398" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="124" y="379" class="small" text-anchor="middle">1</text>
<path d="M168 90 V398" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="168" y="379" class="small" text-anchor="middle">2</text>
<path d="M212 90 V398" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="212" y="379" class="small" text-anchor="middle">3</text>
<path d="M256 90 V398" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="256" y="379" class="small" text-anchor="middle">4</text>
<path d="M80 398 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="65" y="404" class="small" text-anchor="end">-1</text>
<path d="M80 354 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<path d="M80 310 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="65" y="316" class="small" text-anchor="end">1</text>
<path d="M80 266 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="65" y="272" class="small" text-anchor="end">2</text>
<path d="M80 222 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="65" y="228" class="small" text-anchor="end">3</text>
<path d="M80 178 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="65" y="184" class="small" text-anchor="end">4</text>
<path d="M80 134 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="65" y="140" class="small" text-anchor="end">5</text>
<path d="M80 90 H256" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="65" y="96" class="small" text-anchor="end">6</text>
<path d="M80 354 H285" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M80 398 V75" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="293" y="360" class="label" >x</text>
<text x="74" y="66" class="label" >y</text>
<path d="M80 376.0 L256 288.0" fill="none" stroke="#C91E70" stroke-width="3" />
<path d="M80 112.0 L256 376.0" fill="none" stroke="#357D22" stroke-width="3" stroke-dasharray="8 5"/>
<circle cx="212" cy="310" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<text x="226" y="298" class="label" >(3, 1)</text>
<text x="360" y="111" class="label" >Rows: both equations must hold</text>
<text x="360" y="157" class="label" style="fill:#C91E70">x − 2y = 1</text>
<text x="360" y="198" class="label" style="fill:#357D22">3x + 2y = 11</text>
<text x="360" y="270" class="label" >Columns: the same x, y are weights</text>
<text x="360" y="314" class="label" >3(1, 3) + 1(−2, 2) = (1, 11)</text>
<text x="360" y="366" class="small" >Unknown point: (3, 1). Target: (1, 11).</text>
<text x="25" y="430" class="small" >Solid pink: first line. Dashed green: second line. Their common point satisfies both.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="365" viewBox="0 0 1000 365" role="img" aria-labelledby="title desc">
<title id="title">REF → RREF: preserve the solution, clarify the rows</title><desc id="desc">Highlighted pivots form a staircase in REF. RREF makes pivots one and clears entries above. Both augmented matrices represent solution (5,4,2).</desc>

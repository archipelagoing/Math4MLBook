<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="400" viewBox="0 0 1050 400" role="img" aria-labelledby="title desc">
<title id="title">Independence checks the whole list</title><desc id="desc">Two collinear arrows are dependent, two nonparallel arrows are independent, three planar arrows can be dependent with the third equal to the sum of the first two.</desc>
<rect width="1050" height="400" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<defs><marker id="pink-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#C91E70"/></marker><marker id="green-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#357D22"/></marker></defs>
<text x="25" y="40" class="title" >Independence checks the whole list</text>
<text x="30" y="91" class="label" >One line</text>
<text x="370" y="91" class="label" >Two directions</text>
<text x="710" y="91" class="label" >Three planar arrows</text>
<path d="M120 275 L245 150" fill="none" stroke="#C91E70" stroke-width="3" marker-end="url(#pink-arrow)"/>
<path d="M120 275 L182.5 212.5" fill="none" stroke="#357D22" stroke-width="3" marker-end="url(#green-arrow)"/>
<text x="242" y="130" class="small" >2v</text>
<text x="142" y="200" class="small" >v</text>
<path d="M505 275 L575 165" fill="none" stroke="#C91E70" stroke-width="3" marker-end="url(#pink-arrow)"/>
<path d="M505 275 L420 175" fill="none" stroke="#357D22" stroke-width="3" marker-end="url(#green-arrow)"/>
<text x="566" y="148" class="small" >u</text>
<text x="403" y="156" class="small" >v</text>
<path d="M805 275 L920 275" fill="none" stroke="#C91E70" stroke-width="3" marker-end="url(#pink-arrow)"/>
<path d="M805 275 L805 160" fill="none" stroke="#357D22" stroke-width="3" marker-end="url(#green-arrow)"/>
<path d="M805 275 L920 160" fill="none" stroke="#3975DB" stroke-width="3" marker-end="url(#arrow)"/>
<text x="935" y="281" class="small" >u</text>
<text x="782" y="148" class="small" >v</text>
<text x="919" y="145" class="small" >w</text>
<text x="30" y="337" class="small" >Dependent: one is a multiple.</text>
<text x="370" y="337" class="small" >Independent: not parallel.</text>
<text x="710" y="337" class="small" >Dependent: w = u + v.</text>
<text x="25" y="380" class="small" >At most n vectors can be independent in ℝⁿ; pairwise nonparallel is not enough for a longer list.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="530" viewBox="0 0 860 530" role="img" aria-labelledby="title desc">
<title id="title">Coefficients of a repeat family</title><desc id="desc">A two-axis plot of repeat coordinates. The same row r is alpha=2 beta=1 in the unnormalized e,a basis, or 4,2 in the normalized q0,q1 basis. The axes are mathematical record directions, not fabric dimensions.</desc>
<rect width="860" height="530" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}.number{font-size:25px;text-anchor:middle}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<text x="25" y="38" class="title" >Coefficients of a repeat family</text>
<path d="M98 90 V440" stroke="#E3D8D0" stroke-width="1"/>
<text x="98" y="312" class="small" text-anchor="middle">0</text>
<path d="M213 90 V440" stroke="#E3D8D0" stroke-width="1"/>
<text x="213" y="312" class="small" text-anchor="middle">1</text>
<path d="M328 90 V440" stroke="#E3D8D0" stroke-width="1"/>
<text x="328" y="312" class="small" text-anchor="middle">2</text>
<path d="M443 90 V440" stroke="#E3D8D0" stroke-width="1"/>
<text x="443" y="312" class="small" text-anchor="middle">3</text>
<path d="M60 434 H650" stroke="#E3D8D0" stroke-width="1"/>
<path d="M60 359 H650" stroke="#E3D8D0" stroke-width="1"/>
<path d="M60 209 H650" stroke="#E3D8D0" stroke-width="1"/>
<path d="M60 134 H650" stroke="#E3D8D0" stroke-width="1"/>
<path d="M60 284 H690" stroke="#3975DB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M98 450 V76" stroke="#3975DB" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M98 284 L328 209" stroke="#C91E70" stroke-width="3.5"/>
<circle cx="328" cy="209" r="6" fill="#C91E70"/>
<text x="346" y="214" class="label" >r</text>
<path d="M98 284 L328 359" stroke="#357D22" stroke-width="3.5"/>
<circle cx="328" cy="359" r="6" fill="#357D22"/>
<text x="346" y="364" class="label" >s</text>
<path d="M328 209 V359" stroke="#3975DB" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="710" y="290" class="label" >α</text>
<text x="110" y="81" class="label" >β</text>
<circle cx="328" cy="284" r="6" fill="#3975DB"/>
<text x="346" y="274" class="label" >2e</text>
<text x="440" y="113" class="label" >r = 2e + a</text>
<text x="440" y="140" class="small" >(3, 1, 3, 1)</text>
<text x="440" y="178" class="label" >s = 2e − a</text>
<text x="440" y="205" class="small" >(1, 3, 1, 3)</text>
<text x="440" y="243" class="small" >Uniform: 2e</text>
<text x="440" y="270" class="small" >(2, 2, 2, 2)</text>
<text x="25" y="490" class="small" >Each point selects a four-entry record; the plot does not measure the fabric.</text>
</svg>

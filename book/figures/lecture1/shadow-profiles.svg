<text x="88" y="312" class="small" text-anchor="end">1</text>
<path d="M100 252 H360" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="88" y="257" class="small" text-anchor="end">2</text>
<path d="M100 197 H360" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="88" y="202" class="small" text-anchor="end">3</text>
<path d="M100 142 H360" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="88" y="147" class="small" text-anchor="end">4</text>
<path d="M100 362 H375" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M100 362 V128" fill="none" stroke="#3975DB" stroke-width="2" marker-end="url(#arrow)"/>
<text x="382" y="367" class="small" >X</text>
<text x="95" y="119" class="small" >Y</text>
<circle cx="295" cy="307" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>
<path d="M165 299 L173 307 L165 315 L157 307 Z" fill="#8DEB42" stroke="#357D22" stroke-width="2"/>
<text x="43" y="312" class="small" >A</text>

<text x="1003" y="263" class="label" >α</text>
<text x="683" y="109" class="label" >β</text>
<path d="M675 257 L805 192" fill="none" stroke="#C91E70" stroke-width="3" />
<circle cx="805" cy="192" r="6" fill="#C91E70"/>
<text x="820" y="184" class="small" >r = 2e + a</text>
<path d="M675 257 L805 322" fill="none" stroke="#357D22" stroke-width="3" />
<circle cx="805" cy="322" r="6" fill="#357D22"/>
<text x="820" y="314" class="small" >s = 2e − a</text>
<circle cx="805" cy="257" r="6" fill="#3975DB"/>
<text x="823" y="250" class="small" >2e: all X = 2</text>
<text x="638" y="417" class="small" >e = (1,1,1,1);  a = (1,−1,1,−1)</text>
<text x="25" y="465" class="small" >Left: positions on a screen. Right: coefficients that select a four-entry measurement record.</text>
</svg>

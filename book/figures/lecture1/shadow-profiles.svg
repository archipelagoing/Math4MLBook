<path d="M295 244 L303 252 L295 260 L287 252 Z" fill="#8DEB42" stroke="#357D22" stroke-width="2"/>
<text x="43" y="257" class="small" >B</text>
<circle cx="295" cy="197" r="7" fill="#FF4FA3" stroke="#C91E70" stroke-width="2"/>

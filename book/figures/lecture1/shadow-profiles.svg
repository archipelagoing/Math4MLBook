<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">Four labeled marks → one ordered profile</title><desc id="desc">Left: front-screen marks of four beads A,B,C,D at fixed Y=1,2,3,4. Pink circles are profile r=(3,1,3,1), green diamonds are s=(1,3,1,3). Right: coefficient coordinates r=2e+a, s=2e-a, and the uniform profile 2e. These are distinct physical and record coordinate plots.</desc>
<rect width="1120" height="490" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<text x="25" y="38" class="title" >Four labeled marks → one ordered profile</text>
<text x="65" y="82" class="small" >Front marks: X varies, Y labels the bead</text>
<path d="M100 142 V362" fill="none" stroke="#E3D8D0" stroke-width="1" />
<text x="100" y="385" class="small" text-anchor="middle">0</text>

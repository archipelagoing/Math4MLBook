<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="350" viewBox="0 0 1030 350" role="img" aria-labelledby="title desc">
<title id="title">A product with named input and output spaces</title><desc id="desc">Eighteen plain operations and six increases combine column effects. Plain consumes one and produces one; increase consumes one and produces two. The output is twenty-four consumed and thirty produced.</desc>
<rect width="1030" height="350" rx="16" fill="#FFF9F5"/>
<style>text{font-family:Georgia,serif;fill:#543124}.title{font-size:27px;font-weight:bold}.label{font-size:21px}.small{font-size:18px}.number{font-size:25px;text-anchor:middle}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3975DB"/></marker></defs>
<text x="26" y="38" class="title" >Columns are effects; the input supplies their coefficients.</text>
<rect x="28" y="88" width="235" height="150" rx="13" fill="#FFF0F6" stroke="#3975DB" stroke-width="1.3"/>
<text x="42" y="118" class="small" >Operation counts</text>
<text x="43" y="163" class="label" >18 plain</text>
<text x="43" y="200" class="label" >6 increases</text>
<rect x="338" y="88" width="300" height="150" rx="13" fill="#EFF9E7" stroke="#3975DB" stroke-width="1.3"/>
<text x="352" y="118" class="small" >B = consumed / produced</text>
<text x="353" y="163" class="label" >plain column: (1, 1)</text>
<text x="353" y="200" class="label" >increase column: (1, 2)</text>
<rect x="725" y="88" width="275" height="150" rx="13" fill="#EFF9E7" stroke="#3975DB" stroke-width="1.3"/>
<text x="739" y="118" class="small" >Combined record</text>
<text x="740" y="163" class="label" >24 consumed</text>
<text x="740" y="200" class="label" >30 produced</text>
<path d="M270 166 H327" stroke="#3975DB" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M646 166 H714" stroke="#3975DB" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="27" y="286" class="label" >18(1, 1) + 6(1, 2) = (24, 30)</text>
<text x="27" y="322" class="small" >The result counts stitches; it does not specify operation placement or the full fabric.</text>
</svg>

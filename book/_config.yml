title: Mathematical Foundations of Machine Learning
author: A course companion, built with TeachBooks
execute:
  execute_notebooks: "off"
only_build_toc_files: true
html:
  use_multitoc_numbering: true
sphinx:
  config:
    # Static chapters use core extensions; omit unused live-kernel scripts.
    extensions:
      - sphinx_togglebutton
      - sphinx_copybutton
      - myst_nb
      - jupyter_book
      - sphinx_comments
      - sphinx_external_toc
      - sphinx.ext.intersphinx
      - sphinx_design
      - sphinx_book_theme
      - sphinx_multitoc_numbering
    language: en
    html_favicon: figures/yarn-mark.svg
    html_static_path:
      - _static
      - figures
    html_css_files:
      - textbook.css
    html_js_files:
      - textbook.js
    html_theme_options:
      home_page_in_toc: true
      logo:
        text: Math, stitch by stitch
        image_light: yarn-mark.svg
        image_dark: yarn-mark.svg
      repository_url: https://github.com/archipelagoing/Math4MLBook
      repository_branch: main
      path_to_docs: book
      use_repository_button: true
      use_edit_page_button: false
      use_issues_button: false
      show_navbar_depth: 2
      show_toc_level: 1
    html_show_copyright: false
    html_show_sourcelink: false
    nitpicky: true
    external_toc_exclude_missing: true
    myst_enable_extensions:
      - amsmath
      - colon_fence
      - dollarmath
      - attrs_block
      - attrs_inline
      - deflist
      - tasklist
    mathjax3_config:
      chtml:
        mtextInheritFont: true
